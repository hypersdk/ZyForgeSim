# One-off simulation Job (optional). Requires the API image.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgesim-run-once
  namespace: forgesim
  labels:
    app.kubernetes.io/name: forgesim
    app.kubernetes.io/component: batch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgesim
        app.kubernetes.io/component: batch
    spec:
      restartPolicy: Never
      containers:
        - name: sim
          image: forgesim-api:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import json
              from forgesim import _forgesim
              report = _forgesim.run_report_from_config(
                  "configs/clusters/small_h100.yaml", None
              )
              print(json.dumps(json.loads(report["metrics"].to_json()), indent=2))
          volumeMounts:
            - name: outputs
              mountPath: /app/outputs
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: forgesim-outputs
