# Copy to secret.yaml and edit before applying:
#   cp secret.example.yaml secret.yaml
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: forgesim-auth
  namespace: forgesim
  labels:
    app.kubernetes.io/name: forgesim
type: Opaque
stringData:
  FORGESIM_DASHBOARD_USER: Admin
  FORGESIM_DASHBOARD_PASSWORD: change-me-before-deploy
  FORGESIM_AUTH_SECRET: replace-with-long-random-string
